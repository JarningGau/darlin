[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = ["https://mirrors.westlake.edu.cn/ANACONDA/cloud/conda-forge", "https://mirrors.westlake.edu.cn/ANACONDA/cloud/bioconda"]
name = "darlin"
platforms = ["linux-64"]

[tasks]
clone-darlinpy = "test -d darlinpy/.git || git clone https://github.com/jarninggau/darlinpy.git darlinpy"
build-darlinpy = "cd darlinpy && python setup.py build_ext --inplace"
smoke = "PYTHONPATH=src python -m darlin.cli --help && PYTHONPATH=src python -m darlin.cli bulk --help && PYTHONPATH=src python -m darlin.cli bulk run --help"
install-cli = "python -m pip install -e ."
compile = "python -m compileall src tests"
test = "pytest -q"

[dependencies]
python = "3.11.*"
pytest = ">=9.0.2,<10"
pear = ">=0.9.6,<0.10"
pandas = "*"
tqdm = "*"
biopython = "*"
umi_tools = "*"
fuzzysearch = "*"
matplotlib-base = "*"
pip = "*"

[pypi-dependencies]
darlinpy = { path = "./darlinpy", editable = true, extras = ["fast"] }
