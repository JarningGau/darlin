[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = ["https://mirrors.westlake.edu.cn/ANACONDA/cloud/conda-forge", "https://mirrors.westlake.edu.cn/ANACONDA/cloud/bioconda"]
name = "darlin"
platforms = ["linux-64"]

[tasks]
smoke = "PYTHONPATH=src python -m darlin.cli --help && PYTHONPATH=src python -m darlin.cli bulk --help && PYTHONPATH=src python -m darlin.cli bulk run --help && PYTHONPATH=src python -m darlin.cli scrna --help && PYTHONPATH=src python -m darlin.cli scrna run --help"
install-cli = "python -m pip install -e ."
compile = "python -m compileall src tests"
test = "pytest -q"

[dependencies]
python = "3.11.*"
pytest = ">=9.0.2,<10"
pear = ">=0.9.6,<0.10"
pandas = "<3.0.0"
tqdm = ">=4.67.3,<5"
biopython = ">=1.87,<2"
umi_tools = ">=1.1.6,<2"
fuzzysearch = ">=0.8.1,<0.9"
matplotlib-base = ">=3.10.8,<4"
pip = ">=26.0.1,<27"
scipy = "1.13.1.*"

[pypi-dependencies]
darlin-core = { git = "https://github.com/JarningGau/darlin-core", rev = "fe03de6" }
